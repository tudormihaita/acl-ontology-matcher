[project]
name = "acl-ontology-matcher"
version = "0.1.0"
description = "Contrastive bi-encoder for unsupervised ontology matching (ACL course, RR2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.3",
    "sentence-transformers>=3.0",
    "datasets>=2.19",
    "accelerate>=0.30",
    "rdflib>=7.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "umap-learn>=0.5",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contrastive_om"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
